[project]
name = "whisper-cascade"
version = "1.9.1"
description = "Whisper ASR + MarianMT translate + VITS TTS pipeline (CPU)."
requires-python = ">=3.10,<3.11"
dependencies = [
    "transformers==4.44.2",
    "soundfile==0.12.1",
    "numpy<2",
    "torch==2.4.1",
    "torchaudio==2.4.1",
    # MarianMT (make en) uses SentencePiece tokenizers; AutoTokenizer needs this.
    "sentencepiece==0.2.0",
    # HQQ 4-bit grouped quantization for the optional QUANT=hqq ASR mode.
    "hqq",
    # WER evaluation (eval_wer.py) over a Hugging Face audio dataset.
    "jiwer",
    "datasets",
]

# Application project: do not build or install the project as a package.
[tool.uv]
package = false

# Pull torch and torchaudio from the CPU wheel index so the image and venv stay lean.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Default run = fast unit tests only; the real-model tests are opt-in.
markers = [
  "integration: loads a real model (Whisper/MarianMT/VITS; slow; needs the model/cache)",
]
addopts = "-m 'not integration'"
# Make `import transcribe` resolve from the repo root for any pytest invocation
# (direct `pytest`, IDEs), not just `python -m pytest`.
pythonpath = "."
